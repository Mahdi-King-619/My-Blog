<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf8f2">
    <title>Write a story — Mahdi's Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">m.</span>
            <span>Mahdi's Blog</span>
        </a>
        <a class="back-link" href="index.html">← Back to the blog</a>
    </header>

    <main class="admin-main">
        <section id="signInPanel" class="auth-card">
            <div class="admin-intro">
                <p class="eyebrow">ADMIN SIGN IN</p>
                <h1>Welcome back.</h1>
                <p>Sign in with the administrator account configured in Firebase to publish a story.</p>
            </div>
            <form id="signInForm" class="admin-form">
                <label for="adminEmail">
                    Email address
                    <input type="email" id="adminEmail" placeholder="you@example.com" autocomplete="username" required>
                </label>
                <label for="adminPassword">
                    Password
                    <input type="password" id="adminPassword" placeholder="Your password" autocomplete="current-password" required>
                </label>
                <button class="primary-link" type="submit">Sign in <span aria-hidden="true">→</span></button>
                <p id="signInStatus" class="admin-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section id="editorPanel" hidden>
            <div class="editor-heading">
                <div class="admin-intro">
                    <p class="eyebrow">THE WRITING DESK</p>
                    <h1>What's on your mind?</h1>
                    <p>Put your thoughts into words and share them with your readers.</p>
                </div>
                <button id="signOutButton" class="admin-signout" type="button">Sign out</button>
            </div>
            <form id="blogForm" class="admin-form">
                <label for="title">
                    Story title
                    <input type="text" id="title" placeholder="Give your story a title" maxlength="180" required>
                </label>
                <label for="content">
                    Your story
                    <textarea id="content" placeholder="Start writing here..." required></textarea>
                </label>
                <button class="primary-link" type="submit">Publish story <span aria-hidden="true">↗</span></button>
                <p id="publishStatus" class="admin-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="admin.js"></script>
</body>
</html>
